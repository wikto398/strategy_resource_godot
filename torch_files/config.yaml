# Example YAML config for a non-sweep training run.
# Usage: python -m torch_files.train --config torch_files/config.yaml
# Explicit CLI flags override `cli` values; hyperparams go to PPOAgent directly.
# Note: write lr as 0.0003 (PyYAML parses `3e-4` as a string).

hyperparams:
  lr: 0.0003
  gamma: 0.995
  lam: 0.95
  epochs: 5
  batch_size: 64
  rollout_size: 1024
  entropy_coef_start: 0.2
  entropy_coef_end: 0.01
  entropy_target: 0.5
  entropy_adapt_lr: 0.1
  adaptive_entropy: true
  clip_epsilon: 0.2
  value_loss_coef: 0.5

cli:
  instances: 8
  eval_instances: 4
  eval_episodes: 20
  eval_every_timesteps: 10000
  seed: 42
  max_steps: 1000000
  wandb_project: "strategy-resource"
  wandb_mode: "online"
  wandb_tags: "training,reward-shaping,test-single"
  no_tensorboard: true
  quiet: true

# Game-side args forwarded verbatim to every Godot instance (train + eval), same
# path as repeatable CLI --engine_args (which win on key conflicts). Reward
# coefficients are consumed by the RewardConfig autoload (globals/RewardConfig.gd);
# values below are the current defaults, included as documentation.
engine_args:
  economy_coef: 0.05
  surplus_coef: 0.05
  over_commit_penalty: 0.25
  over_commit_state_penalty: 0.1
  build_finish_coef: 0.15
  win_bonus: 50
  pop_milestone_bonus: 1.5
  housing_coef: 1.0
  stock_warning_coef: 0.02
  win_progress_coef: 0.005
  skip_penalty: -0.02
  time_penalty: -0.005
  production_bonus_coef: 0.3
  production_penalty_coef: 0.01
  construction_bonus: 0.2
  productive_bonus: 0.3
  balance_coef: 0.2
  build_start_coef: 0.1
  deficit_coef: 0.015
